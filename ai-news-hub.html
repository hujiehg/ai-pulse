<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Pulse · 前沿资讯中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#f3f3f7; --bg2:#ffffff; --bg-card:#ffffff;
    --accent:#0067c0; --accent-light:#2b88d8; --accent-dark:#004578;
    --accent-grad:linear-gradient(135deg,#0067c0,#2b88d8);
    --purple:#7b3cb0; --purple-grad:linear-gradient(135deg,#7b3cb0,#a44bd6);
    --teal:#008272; --teal-grad:linear-gradient(135deg,#008272,#00b294);
    --orange:#ca5010; --orange-grad:linear-gradient(135deg,#ca5010,#f7630c);
    --red:#c50f1f; --red-grad:linear-gradient(135deg,#c50f1f,#e81123);
    --green:#107c10; --green-grad:linear-gradient(135deg,#107c10,#498205);
    --text:#1a1a2e; --text-sub:#5a5a72; --text-dim:#8a8aa0;
    --border:#e5e5f0; --border-strong:#d0d0de;
    --shadow:0 2px 8px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.08);
    --shadow-hover:0 8px 24px rgba(0,103,192,0.14), 0 0 1px rgba(0,0,0,0.1);
    --radius:10px; --radius-sm:6px;
  }
  [data-theme="dark"]{
    --bg:#1a1a2e; --bg2:#16213e; --bg-card:#1e1e3a;
    --accent:#4dabf7; --accent-light:#74c0fc; --accent-dark:#1971c2;
    --accent-grad:linear-gradient(135deg,#4dabf7,#74c0fc);
    --purple:#ae8ed8; --purple-grad:linear-gradient(135deg,#9775fa,#b197fc);
    --teal:#20c997; --teal-grad:linear-gradient(135deg,#20c997,#38d9a9);
    --orange:#ff922b; --orange-grad:linear-gradient(135deg,#ff922b,#ffa94d);
    --red:#ff6b6b; --red-grad:linear-gradient(135deg,#ff6b6b,#fa5252);
    --green:#40c057; --green-grad:linear-gradient(135deg,#40c057,#51cf66);
    --text:#e0e0ef; --text-sub:#8e8ea0; --text-dim:#6c6c80;
    --border:#2a2a45; --border-strong:#3a3a55;
    --shadow:0 2px 8px rgba(0,0,0,0.3), 0 0 1px rgba(0,0,0,0.4);
    --shadow-hover:0 8px 24px rgba(77,171,247,0.2), 0 0 1px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .acrylic{
    background:rgba(255,255,255,0.72);
    backdrop-filter:blur(30px) saturate(140%);
    -webkit-backdrop-filter:blur(30px) saturate(140%);
  }
  [data-theme="dark"] .acrylic{background:rgba(30,30,58,0.72)}
  /* ===== Header ===== */
  .header{
    position:sticky;top:0;z-index:100;
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1640px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;gap:20px;
  }
  .logo{display:flex;align-items:center;gap:10px}
  .logo-icon{
    width:36px;height:36px;border-radius:8px;
    background:var(--accent-grad);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(0,103,192,0.3);
  }
  .logo-icon svg{width:20px;height:20px;fill:#fff}
  .logo-text{font-size:18px;font-weight:700;letter-spacing:-0.5px}
  .logo-text b{color:var(--accent)}
  .logo-sub{font-size:11px;color:var(--text-dim);font-weight:400}
  .header-search{
    flex:1;max-width:480px;position:relative;
  }
  .header-search input{
    width:100%;padding:9px 14px 9px 38px;
    border:1px solid var(--border-strong);border-radius:20px;
    background:var(--bg2);font-size:13px;font-family:inherit;color:var(--text);
    transition:border-color .2s, box-shadow .2s;
  }
  .header-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,103,192,0.12)}
  .header-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--text-dim)}
  .header-stats{display:flex;gap:16px;align-items:center}
  .hstat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
  .hstat .n{font-size:18px;font-weight:700;color:var(--accent);font-family:'Inter',sans-serif}
  .hstat .l{font-size:9px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase}
  .refresh-btn{
    padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--accent);
    background:var(--accent-grad);color:#fff;font-size:12px;font-weight:600;font-family:inherit;
    cursor:pointer;transition:transform .15s, box-shadow .2s;
    display:flex;align-items:center;gap:6px;
  }
  .refresh-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,103,192,0.3)}
  .refresh-btn:active{transform:translateY(0)}
  .refresh-btn svg{width:14px;height:14px;fill:#fff}
  .refresh-btn.spinning svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== Theme Button ===== */
  .theme-btn{
    width:36px;height:36px;border-radius:var(--radius-sm);
    border:1px solid var(--border-strong);background:var(--bg2);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s;padding:0;
  }
  .theme-btn:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(0,103,192,0.18)}
  .theme-btn svg{width:18px;height:18px;fill:var(--text-sub)}
  .theme-btn:hover svg{fill:var(--accent)}
  .theme-btn .icon-sun{display:block}
  .theme-btn .icon-moon{display:none}
  :root .theme-btn .icon-moon{display:none}
  [data-theme="dark"] .theme-btn .icon-sun{display:none}
  [data-theme="dark"] .theme-btn .icon-moon{display:block}

  /* ===== Tabs ===== */
  .tabs{
    max-width:1640px;margin:0 auto;padding:12px 24px 0;
    display:flex;gap:4px;flex-wrap:wrap;
  }
  .tab{
    padding:8px 16px;border-radius:6px 6px 0 0;
    font-size:13px;font-weight:500;color:var(--text-sub);cursor:pointer;
    border:1px solid transparent;border-bottom:none;
    transition:all .2s;position:relative;bottom:-1px;
  }
  .tab:hover{background:rgba(0,103,192,0.05);color:var(--accent)}
  .tab.active{
    background:var(--bg2);border-color:var(--border-strong);color:var(--accent);
    font-weight:600;
  }
  .tab .badge{
    display:inline-block;margin-left:6px;padding:1px 6px;border-radius:10px;
    background:var(--accent);color:#fff;font-size:10px;font-weight:600;
  }

  /* ===== Layout ===== */
  .main{max-width:1640px;margin:0 auto;padding:16px 24px 40px;overflow:hidden;flex:1;min-height:0}
  .grid{display:flex;gap:0;align-items:stretch;height:100%}
  .left-panel{width:280px;flex-shrink:0;padding-right:16px;height:100%;overflow-y:auto}
  .grid>section{flex:1 1 0%;min-width:0;padding-right:16px;height:100%;overflow-y:auto}
  .resizer{
    flex-shrink:0;width:10px;cursor:col-resize;z-index:50;
    background:#c0c4d0;border-left:1px solid #a0a4b0;border-right:1px solid #a0a4b0;
    transition:background .2s,border-color .2s;border-radius:5px;
    align-self:stretch;margin:8px 0;
  }
  .resizer:hover,.resizer.dragging{background:var(--accent);border-color:var(--accent)}
  .right-panel{
    display:flex;flex-direction:column;gap:16px;
    width:var(--rpw,320px);min-width:240px;max-width:520px;flex-shrink:0;
    height:100%;overflow-y:auto;
  }
  @media (max-width:1280px){.left-panel{width:240px}.resizer,.right-panel{display:none}}
  @media (max-width:860px){.left-panel{display:none}.grid>section{padding-right:0}}

  /* 独立滚动条 */
  .left-panel::-webkit-scrollbar,.grid>section::-webkit-scrollbar,.right-panel::-webkit-scrollbar{width:5px}
  .left-panel::-webkit-scrollbar-thumb,.grid>section::-webkit-scrollbar-thumb,.right-panel::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
  .left-panel::-webkit-scrollbar-track,.grid>section::-webkit-scrollbar-track,.right-panel::-webkit-scrollbar-track{background:transparent}
  .left-panel{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;overscroll-behavior:contain}
  .grid>section{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;overscroll-behavior:contain}
  .right-panel{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;overscroll-behavior:contain}

  /* ===== Card ===== */
  .card{
    background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .card-head{
    padding:14px 16px 10px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .card-title{font-size:13px;font-weight:600;color:var(--text)}
  .card-title .ico{display:inline-block;width:16px;height:16px;margin-right:6px;vertical-align:-3px}
  .card-body{padding:12px 16px}

  /* ===== Left Panel: 厂商筛选 ===== */
  .vendor-list{display:flex;flex-direction:column;gap:2px}
  .vendor-item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);
    cursor:pointer;transition:background .15s;
  }
  .vendor-item:hover{background:rgba(0,103,192,0.06)}
  .vendor-item.active{background:rgba(0,103,192,0.1)}
  .vendor-logo{
    width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:#fff;flex-shrink:0;
  }
  .vendor-info{flex:1;min-width:0}
  .vendor-name{font-size:12px;font-weight:600}
  .vendor-count{font-size:10px;color:var(--text-dim)}
  .vendor-item.active .vendor-count{color:var(--accent)}
  .vendor-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

  .cat-list{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .cat-item{
    display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--radius-sm);
    font-size:12px;color:var(--text-sub);cursor:pointer;transition:background .15s;
  }
  .cat-item:hover{background:rgba(0,103,192,0.06)}
  .cat-item.active{background:rgba(0,103,192,0.1);color:var(--accent);font-weight:600}
  .cat-item .num{margin-left:auto;font-size:10px;color:var(--text-dim)}

  /* ===== Center: News Feed ===== */
  .feed-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 0 12px;
  }
  .feed-title{font-size:16px;font-weight:700}
  .feed-meta{font-size:11px;color:var(--text-dim)}
  /* 双语标题切换按钮组 */
  .title-mode-switch{
    display:inline-flex;align-items:center;gap:2px;
    padding:2px;border-radius:6px;background:rgba(0,0,0,0.04);
  }
  [data-theme="dark"] .title-mode-switch{background:rgba(255,255,255,0.05)}
  .tm-btn{
    border:none;background:transparent;color:var(--text-sub);
    font-size:11px;font-weight:500;font-family:inherit;
    padding:4px 10px;border-radius:4px;cursor:pointer;
    transition:all .15s;line-height:1;
  }
  .tm-btn:hover{color:var(--text)}
  .tm-btn.active{background:var(--accent);color:#fff;font-weight:600}
  [data-theme="dark"] .tm-btn.active{background:var(--accent);color:#fff}
  .news-list{display:flex;flex-direction:column;gap:10px}
  .news-card{
    background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow);
    transition:box-shadow .2s, transform .15s, border-color .2s;
    cursor:pointer;position:relative;
  }
  .news-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px);border-color:var(--accent-light)}
  .news-card.unread::before{
    content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
    background:var(--accent);border-radius:0 2px 2px 0;
  }
  .news-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .vendor-tag{
    display:inline-flex;align-items:center;gap:4px;
    padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;color:#fff;
  }
  .cat-tag{
    padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;
    background:#eef0f5;color:var(--text-sub);
  }
  .cat-tag.Release{background:#e7f3ff;color:var(--accent)}
  .cat-tag.Funding{background:#fff4e6;color:var(--orange)}
  .cat-tag.Research{background:#f0eaff;color:var(--purple)}
  .cat-tag.Safety{background:#ffe9ec;color:var(--red)}
  .cat-tag.Product{background:#e6faf4;color:var(--teal)}
  .cat-tag.Agent{background:#fff9e6;color:#a08400}
  .news-time{font-size:10px;color:var(--text-dim);margin-left:auto}
  .news-title{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:6px;color:var(--text)}
  .news-title a{color:inherit;text-decoration:none}
  .news-card:hover .news-title{color:var(--accent)}
  .news-title-en{font-size:11px;color:var(--text-dim);font-weight:400;margin-top:2px;line-height:1.3}
  [data-theme="dark"] .news-title-en{color:var(--text-dim)}
  .news-summary{font-size:12px;line-height:1.6;color:var(--text-sub)}
  .news-summary b{color:var(--text);font-weight:600}
  .news-foot{display:flex;align-items:center;gap:12px;margin-top:8px}
  .news-source{font-size:10px;color:var(--text-dim)}
  .news-source a{color:var(--accent);text-decoration:none}
  /* 时间筛选按钮 */
  .time-filter{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:6px;background:rgba(0,0,0,0.04)}
  [data-theme="dark"] .time-filter{background:rgba(255,255,255,0.05)}
  .tf-btn{border:none;background:transparent;color:var(--text-sub);font-size:11px;font-weight:500;font-family:inherit;padding:4px 10px;border-radius:4px;cursor:pointer;transition:all .15s;line-height:1}
  .tf-btn:hover{color:var(--text)}
  .tf-btn.active{background:var(--accent);color:#fff;font-weight:600}
  /* 收藏星标 */
  .bookmark-btn{border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--text-dim);padding:2px 4px;border-radius:4px;transition:all .15s;line-height:1}
  .bookmark-btn:hover{color:var(--orange);transform:scale(1.15)}
  .bookmark-btn.active{color:var(--orange)}
  .news-foot .bookmark-btn{margin-left:auto}
  /* 已收藏/已读筛选 */
  .filter-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-sub);transition:background .15s}
  .filter-item:hover{background:rgba(0,103,192,0.06)}
  [data-theme="dark"] .filter-item:hover{background:rgba(255,255,255,0.05)}
  .filter-item.active{background:rgba(0,103,192,0.1);color:var(--accent);font-weight:600}
  [data-theme="dark"] .filter-item.active{background:rgba(77,171,247,0.15);color:var(--accent-light)}
  .filter-item .icon{font-size:14px}
  .filter-item .count{margin-left:auto;font-size:10px;color:var(--text-dim)}
  .impact{
    display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;
    padding:2px 6px;border-radius:4px;
  }
  .impact.high{background:#ffe9ec;color:var(--red)}
  .impact.med{background:#fff4e6;color:var(--orange)}
  .impact.low{background:#e6faf4;color:var(--teal)}
  .score-badge{
    display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;
    padding:2px 6px;border-radius:4px;cursor:default;
  }
  .score-badge.score-s{background:#ffe9ec;color:var(--red)}
  .score-badge.score-h{background:#fff0f3;color:var(--red)}
  .score-badge.score-m{background:#fff4e6;color:var(--orange)}
  .score-badge.score-l{background:#e6faf4;color:var(--teal)}
  .score-badge.score-n{background:#f0f0f5;color:var(--text-dim)}
  .score-badge .score-num{font-size:9px;opacity:0.8;margin-left:2px}
  .sort-switch{display:flex;gap:2px;background:var(--bg);border-radius:var(--radius-sm);padding:2px}
  .sort-btn{padding:4px 10px;border:none;border-radius:4px;background:transparent;color:var(--text-sub);font-size:11px;cursor:pointer;transition:all .15s}
  .sort-btn.active{background:var(--accent);color:#fff;font-weight:600}
  .sort-btn:hover:not(.active){background:var(--border)}
  .skeleton{
    background:linear-gradient(90deg,#f0f0f5 25%,#e5e5f0 50%,#f0f0f5 75%);
    background-size:200% 100%;animation:shimmer 1.5s infinite;
    border-radius:4px;
  }
  @keyframes shimmer{to{background-position:-200% 0}}
  .skel-card{padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px}
  .skel-title{height:16px;width:70%;margin-bottom:8px}
  .skel-sum{height:12px;width:100%;margin-bottom:4px}
  .skel-sum2{height:12px;width:85%}
  /* 暗色模式：skeleton / cat-tag / impact 适配 */
  [data-theme="dark"] .skeleton{
    background:linear-gradient(90deg,#2a2a45 25%,#3a3a55 50%,#2a2a45 75%);
    background-size:200% 100%;
  }
  [data-theme="dark"] .cat-tag{background:#2a2a45;color:var(--text-sub)}
  [data-theme="dark"] .cat-tag.Release{background:#19314a;color:var(--accent)}
  [data-theme="dark"] .cat-tag.Funding{background:#3a2a14;color:var(--orange)}
  [data-theme="dark"] .cat-tag.Research{background:#2e2440;color:var(--purple)}
  [data-theme="dark"] .cat-tag.Safety{background:#3a1f24;color:var(--red)}
  [data-theme="dark"] .cat-tag.Product{background:#143830;color:var(--teal)}
  [data-theme="dark"] .cat-tag.Agent{background:#3a3414;color:#c9a83a}
  [data-theme="dark"] .impact.high{background:#3a1f24;color:var(--red)}
  [data-theme="dark"] .impact.med{background:#3a2a14;color:var(--orange)}
  [data-theme="dark"] .impact.low{background:#143830;color:var(--teal)}
  [data-theme="dark"] .score-badge.score-s{background:#3a1f24;color:var(--red)}
  [data-theme="dark"] .score-badge.score-h{background:#3a1f24;color:var(--red)}
  [data-theme="dark"] .score-badge.score-m{background:#3a2a14;color:var(--orange)}
  [data-theme="dark"] .score-badge.score-l{background:#143830;color:var(--teal)}
  [data-theme="dark"] .score-badge.score-n{background:#2a2a45;color:var(--text-dim)}
  [data-theme="dark"] .sort-btn:hover:not(.active){background:var(--border-strong)}
  [data-theme="dark"] .trend-tag{background:#2a2a45;color:var(--text-sub)}

  /* ===== Right Panel ===== */
  .trend-list{display:flex;flex-wrap:wrap;gap:6px}
  .trend-tag{
    padding:4px 10px;border-radius:14px;font-size:11px;font-weight:500;
    background:#eef0f5;color:var(--text-sub);cursor:pointer;transition:all .15s;
  }
  .trend-tag:hover{background:var(--accent);color:#fff}
  .trend-tag .n{font-size:9px;opacity:.7;margin-left:3px}
  #chartTrend{height:160px}
  #chartScore{height:180px}
  #chartVendor{height:220px}
  .stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
  .stat-row:last-child{border-bottom:none}
  .stat-row .k{color:var(--text-sub)}
  .stat-row .v{font-weight:700;color:var(--accent)}

  /* ===== Footer ===== */
  .footer{
    max-width:1640px;margin:0 auto;padding:20px 24px;
    border-top:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--text-dim);flex-wrap:wrap;gap:8px;
  }
  .footer a{color:var(--accent);text-decoration:none}

  /* ===== Toast ===== */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
    background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--radius-sm);
    font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.2);
    transition:transform .3s;z-index:1000;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* ===== Responsive ===== */
  @media (max-width:760px){
    .header-inner{padding:10px 14px;flex-wrap:wrap}
    .header-search{order:3;max-width:none;flex-basis:100%}
    .header-stats{gap:10px}
    .hstat .n{font-size:15px}
    .tabs{padding:8px 14px 0}
    .main{padding:12px 14px 30px}
    .news-card{padding:12px}
    .news-title{font-size:13px}
  }

  /* ===== Article Modal ===== */
  .article-modal{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;
    pointer-events:none;visibility:hidden;
    transition:visibility 0s .35s;
  }
  .article-modal.open{
    pointer-events:auto;visibility:visible;
    transition:visibility 0s 0s;
  }
  .article-modal-backdrop{
    position:absolute;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.45);
    opacity:0;transition:opacity .3s ease;
  }
  .article-modal.open .article-modal-backdrop{opacity:1}
  .article-modal-container{
    position:absolute;top:0;right:0;bottom:0;
    width:var(--modal-w,min(680px,100vw));min-width:400px;max-width:90vw;
    background:#fff;box-shadow:-8px 0 40px rgba(0,0,0,0.15);
    transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .modal-resizer{
    position:absolute;left:0;top:0;bottom:0;width:10px;cursor:col-resize;z-index:100;
    background:transparent;transition:background .2s;
  }
  .modal-resizer:hover,.modal-resizer.dragging{background:var(--accent)}
  .article-modal.open .article-modal-container{transform:translateX(0)}
  .article-modal-header{
    padding:20px 28px 16px;border-bottom:1px solid var(--border);
    background:#fff;flex-shrink:0;
  }
  .modal-header-inner{max-width:100%}
  .modal-back-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--bg2);font-size:12px;font-weight:500;color:var(--text-sub);
    cursor:pointer;font-family:inherit;transition:all .15s;margin-bottom:14px;
  }
  .modal-back-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .modal-meta{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;
  }
  .modal-title{
    font-size:20px;font-weight:700;line-height:1.4;color:var(--text);
    margin-bottom:6px;
  }
  .modal-subtitle{font-size:12px;color:var(--text-dim)}
  .article-modal-body{
    flex:1;overflow-y:auto;padding:28px;
    scrollbar-width:thin;scrollbar-color:#d0d0de transparent;
  }
  .article-modal-body::-webkit-scrollbar{width:6px}
  .article-modal-body::-webkit-scrollbar-thumb{background:#d0d0de;border-radius:3px}
  .article-modal-loading{
    max-width:640px;margin:0 auto;
  }
  .article-modal-loading .skel-block{
    margin-bottom:16px;
  }
  .article-modal-loading .skel-h1{height:24px;width:60%;margin-bottom:20px}
  .article-modal-loading .skel-h2{height:18px;width:40%;margin-bottom:12px}
  .article-modal-loading .skel-p{height:14px;width:100%;margin-bottom:8px}
  .article-modal-loading .skel-p-short{height:14px;width:75%;margin-bottom:8px}
  .article-modal-loading .skel-li{height:14px;width:90%;margin-bottom:10px;padding-left:12px}
  .article-modal-loading .skel-divider{height:1px;background:var(--border);margin:24px 0}
  .article-modal-content{
    max-width:640px;margin:0 auto;font-size:15px;line-height:1.8;color:var(--text);
  }
  .article-modal-content h2.summary-heading{
    font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px;
    padding-bottom:8px;
    display:flex;align-items:center;gap:6px;
  }
  .article-modal-content .summary-section{margin-bottom:28px}
  .article-modal-content .summary-text{
    font-size:15px;line-height:1.8;color:#3a3a4a;
  }
  .article-modal-content .summary-points{
    list-style:none;padding:0;margin:0;
  }
  .article-modal-content .summary-points li{
    position:relative;padding:8px 0 8px 20px;font-size:14px;line-height:1.7;color:#3a3a4a;
    border-bottom:1px solid #f0f0f5;
  }
  .article-modal-content .summary-points li:last-child{border-bottom:none}
  .article-modal-content .summary-points li::before{
    content:"";position:absolute;left:0;top:16px;width:8px;height:8px;
    border-radius:50%;background:var(--accent);
  }
  .article-modal-content .summary-vendor{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .article-modal-content .vendor-badge{
    display:inline-flex;align-items:center;gap:4px;
    padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;color:#fff;
  }
  .article-modal-content .vendor-type{font-size:13px;color:var(--text-sub)}
  .article-modal-content .article-text{
    font-size:15px;line-height:1.8;color:#3a3a4a;margin-bottom:12px;
  }
  .article-modal-content .ai-fallback-note{
    display:inline-block;padding:8px 14px;border-radius:var(--radius-sm);
    background:#fff4e6;color:var(--orange);font-size:12px;margin-top:12px;
  }
  .article-modal-content .summary-disclaimer{
    margin-top:32px;padding:14px 16px;border-radius:var(--radius-sm);
    background:#f5f7fa;font-size:12px;line-height:1.6;color:var(--text-dim);
  }
  .article-modal-content .summary-disclaimer a{color:var(--accent);text-decoration:none}
  .article-modal-content .summary-disclaimer a:hover{text-decoration:underline}
  .article-modal-footer{
    padding:16px 28px;border-top:1px solid var(--border);
    background:#fff;flex-shrink:0;display:none;gap:12px;align-items:center;
    justify-content:center;
  }
  .article-original-link{
    display:inline-flex;align-items:center;gap:6px;
    padding:10px 24px;border-radius:var(--radius-sm);
    background:var(--accent-grad);color:#fff;font-size:14px;font-weight:600;
    text-decoration:none;transition:all .2s;box-shadow:0 2px 8px rgba(0,103,192,0.25);
  }
  .article-original-link:hover{
    transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,103,192,0.35);
    color:#fff;text-decoration:none;
  }

  /* 增强摘要正文样式 */
  .article-modal-content p.summary-text {
    margin-bottom: 16px;
  }
  .article-modal-content p.summary-text:last-child {
    margin-bottom: 0;
  }
  .article-modal-content blockquote.summary-quote {
    margin: 16px 0;
    padding: 14px 18px;
    border-left: 4px solid var(--accent-light);
    background: #f8fafc;
    border-radius: 0 8px 8px 0;
    font-size: 14px;
    line-height: 1.7;
    color: #4a4a5a;
    font-style: italic;
  }
  .article-modal-content .summary-points li strong {
    color: var(--accent-dark);
    font-weight: 600;
  }
  .article-modal-content .info-card {
    margin: 16px 0;
    padding: 14px 16px;
    border-radius: 8px;
    background: #e7f3ff;
    border: 1px solid #cce5ff;
    font-size: 14px;
    line-height: 1.7;
    color: #1a3a5c;
  }
  .article-modal-content .info-card.warn {
    background: #fff4e6;
    border-color: #ffd8a8;
    color: #5c3a1a;
  }
  .article-modal-content .info-card.tip {
    background: #e6faf4;
    border-color: #a8f0d8;
    color: #1a5c3a;
  }
  .article-modal-content b,
  .article-modal-content strong {
    color: var(--text);
    font-weight: 600;
  }

  /* ===== Dark mode: Article Modal 适配 ===== */
  [data-theme="dark"] .article-modal-container{background:var(--bg2);box-shadow:-8px 0 40px rgba(0,0,0,0.5)}
  [data-theme="dark"] .modal-resizer:hover,[data-theme="dark"] .modal-resizer.dragging{background:var(--accent-light)}

  [data-theme="dark"] .article-modal-content .summary-points li{color:#c0c0d0;border-bottom:1px solid #2a2a45}

  [data-theme="dark"] .article-modal-content blockquote.summary-quote{background:#1e1e3a;color:#b0b0c0;border-left-color:var(--accent-light)}
  [data-theme="dark"] .article-modal-content .info-card{background:#1a2a4a;border:1px solid #2a4a6a;color:#c0d0e0}
  [data-theme="dark"] .article-modal-content .info-card.warn{background:#3a2a14;border-color:#5a4a24;color:#e0c890}
  [data-theme="dark"] .article-modal-content .info-card.tip{background:#143830;border-color:#2a5a44;color:#90e0c0}
  [data-theme="dark"] .article-modal-content .summary-disclaimer{background:#1e1e3a;color:var(--text-dim)}
  [data-theme="dark"] .article-modal-footer{background:var(--bg2)}
  [data-theme="dark"] .modal-back-btn{background:var(--bg-card)}

  /* ===== Modal Responsive ===== */
  @media (max-width:760px){
    .article-modal-container{
      width:100vw;right:0;

    .article-modal-header{padding:16px 18px 12px}
    .modal-title{font-size:17px}
    .article-modal-body{padding:18px}
    .article-modal-footer{padding:14px 18px}
  }
</style>
</head>

async function translateText(text, from='en', to='zh') {
  if (!text || typeof text !== 'string') return text;
  const key = `${from}|${to}:${text}`;
  if (TRANSLATION_CACHE[key]) return TRANSLATION_CACHE[key];

  // 限流：如果正在进行中的翻译过多，直接返回原文占位
  if (TRANSLATION_IN_FLIGHT >= MAX_CONCURRENT_TRANSLATIONS) {
    return text + ' <span style="color:var(--text-dim);font-size:0.9em">(翻译中...)</span>';
  }

  TRANSLATION_IN_FLIGHT++;
  try {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
    const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
    const data = await resp.json();
    if (data && data.responseData && data.responseData.translatedText) {
      const translated = data.responseData.translatedText;
      // MyMemory 有时返回原文表示翻译失败
      if (translated.toLowerCase() !== text.toLowerCase()) {
        TRANSLATION_CACHE[key] = translated;
        // 持久化缓存（限制大小）
        try {
          const keys = Object.keys(TRANSLATION_CACHE);
          if (keys.length > 500) {
            keys.slice(0, keys.length - 500).forEach(k => delete TRANSLATION_CACHE[k]);
          }
          localStorage.setItem('ai_pulse_trans_cache', JSON.stringify(TRANSLATION_CACHE));
        } catch(e) {}
        return translated;
      }
    }
  } catch(e) {
    console.warn('MyMemory translation failed:', e.message);
  } finally {
    TRANSLATION_IN_FLIGHT--;
  }

  // 备用：词典简单替换
  let fallback = text;
  for (const [en, zh] of Object.entries(FALLBACK_DICT)) {
    const re = new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    fallback = fallback.replace(re, zh);
  }
  TRANSLATION_CACHE[key] = fallback;
  return fallback;
}

/* 批量翻译（用于新闻列表渲染后异步更新） */
async function batchTranslateNews(list) {
  let count = 0;
  for (const n of list) {
    if (count >= 8) break; // 每次渲染最多翻译8个新文本（原3个）
    const titleKey = `en|zh:${n.title}`;
    const sumKey = `en|zh:${n.summary}`;
    const needsTitle = !TRANSLATION_CACHE[titleKey] && n.title && /^[\x00-\x7F]+$/.test(n.title);
    const needsSum = !TRANSLATION_CACHE[sumKey] && n.summary && /^[\x00-\x7F]+$/.test(n.summary);

    if (needsTitle) {
      translateText(n.title).then(translated => {
        if (translated) {
          const el = document.querySelector(`.news-title[data-id="${n.id}"]`);
          if (el) el.innerHTML = translated;
          const mel = document.querySelector(`.modal-title[data-news-id="${n.id}"]`);
          if (mel) mel.textContent = translated;
        }
      });
      count++;
    }
    if (needsSum && count < 3) {
      translateText(n.summary).then(translated => {
        if (translated) {
          const el = document.querySelector(`.news-summary[data-id="${n.id}"]`);
          if (el) el.innerHTML = translated;
        }
      });
      count++;
    }
  }
}

function parseDate(str){
  if(!str) return Date.now();
  const d = new Date(str);
  return isNaN(d) ? Date.now() : d.getTime();
}
function timeAgo(ts){
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if(m<1) return '刚刚';
  if(m<60) return m+'分钟前';
  const h = Math.floor(m/60);
  if(h<24) return h+'小时前';
  const d = Math.floor(h/24);
  if(d<7) return d+'天前';
  return new Date(ts).toLocaleDateString('zh-CN');
}
function classify(title, desc){
  const text = (title + ' ' + desc).toLowerCase();
  let best = 'Product', bestScore = 0;
  for(const [cat, kws] of Object.entries(CAT_KEYWORDS)){
    let score = 0;
    kws.forEach(k=>{ if(text.includes(k.toLowerCase())) score++; });
    if(score > bestScore){ bestScore = score; best = cat; }
  }
  return best;
}
function detectVendor(title, desc, sourceUrl){

  if(sourceUrl){
    if(sourceUrl.includes('openai.com')) return 'openai';
    if(sourceUrl.includes('anthropic.com')) return 'anthropic';
    if(sourceUrl.includes('blog.google') || sourceUrl.includes('deepmind')) return 'google';
    if(sourceUrl.includes('huggingface.co')) return 'huggingface';
    if(sourceUrl.includes('arxiv.org')) return 'arxiv';
    if(sourceUrl.includes('blogs.nvidia.com') || sourceUrl.includes('nvidia.com')) return 'nvidia';
    if(sourceUrl.includes('microsoft.com')) return 'microsoft';
    if(sourceUrl.includes('techcrunch.com')) return 'techcrunch';
    if(sourceUrl.includes('venturebeat.com')) return 'venturebeat';
    if(sourceUrl.includes('hnrss.org') || sourceUrl.includes('ycombinator')) return 'hackernews';
    if(sourceUrl.includes('reddit.com')) return 'reddit_ml';
    if(sourceUrl.includes('dev.to')) return 'devto';
  }
  if(/openai|gpt|chatgpt|sam altman/i.test(text)) return 'openai';
  if(/anthropic|claude|sonnet|opus|haiku/i.test(text)) return 'anthropic';
  if(/google|gemini|deepmind|bard/i.test(text)) return 'google';
  if(/hugging|transformers|diffusers/i.test(text)) return 'huggingface';
  if(/nvidia|cuda|tensorrt|omniverse/i.test(text)) return 'nvidia';
  if(/microsoft|copilot|azure openai/i.test(text)) return 'microsoft';
  if(/hacker.?news|hn\b/i.test(text) && !/hacker/.test(text.replace(/hacker.?news/i,''))) return 'hackernews';
  if(/reddit|r\/(?:machinelearning|ml)/i.test(text)) return 'reddit_ml';
  if(/dev\.to|devto/i.test(text)) return 'devto';
  return 'other';
}
function assessImpact(title, desc, vendor){
  const text = (title + ' ' + desc).toLowerCase();
  let score = 0;
  if(/launch|release|发布|推出|gpt-5|claude 5|gemini 3|kimi k|qwen[0-9]|deepseek v/i.test(text)) score += 2;
  if(/funding|billion|融资|估值|ipo|acquisition|收购/i.test(text)) score += 2;
  if(/safety|security|breach|jailbreak|leak|安全|泄露/i.test(text)) score += 1;
  if(/api|developer|platform|开放/i.test(text)) score += 1;
  if(vendor !== 'other') score += 1;
  if(score >= 3) return 'high';
  if(score >= 1) return 'med';
  return 'low';
}

const SCORE_ENTITY_RE = /(?:GPT|Claude|Gemini|Llama|Mistral|Qwen|DeepSeek|Kimi|Moonshot|ChatGPT|OpenAI|Anthropic|Google|Meta|Microsoft|Nvidia|Transformer|Diffusion|RLHF|MoE|Mamba)\b/gi;

function calculateNewsScore(item){
  const title = (item.title||'').trim();
  const summary = (item.summary||'').trim();
  const raw = (item._rawContent||'').trim();
  const vendor = item.vendor||'other';
  const category = item.category||'Product';
  const pubDate = item.pubDate||0;
  const text = (title+' '+summary+' '+raw).toLowerCase();
  let reasons = [];

  // 1. 内容质量 (0-30)
  let cq = 0;
  const tLen = title.length;
  cq += tLen>=40&&tLen<=100?6 : tLen>=25?4 : tLen>=15?2 : 1;
  const sLen = summary.length;
  cq += sLen>=200?8 : sLen>=100?6 : sLen>=50?4 : sLen>=20?2 : 0;
  if(raw){
    const paras = raw.split(/\n\s*\n/).filter(p=>p.trim().length>20);
    cq += paras.length>=8?10 : paras.length>=5?8 : paras.length>=3?6 : 4;
  } else { cq += sLen>100?4:1; }
  const entities = (text.match(SCORE_ENTITY_RE)||[]).length;
  cq += entities>=5?6 : entities>=3?4 : entities>=1?2 : 0;
  cq = Math.min(cq, 30);

  // 2. 关键词价值 (0-20)
  let kv = 0;
  let ms = 0; SCORE_KEYWORDS.major.forEach(k=>{ if(text.includes(k)) ms+=2; }); ms=Math.min(ms,8); kv+=ms;
  let rs = 0; SCORE_KEYWORDS.research.forEach(k=>{ if(text.includes(k)) rs+=1; }); rs=Math.min(rs,6); kv+=rs;
  let fs = 0; SCORE_KEYWORDS.funding.forEach(k=>{ if(text.includes(k)) fs+=1; }); fs=Math.min(fs,4); kv+=fs;
  let ss = 0; SCORE_KEYWORDS.security.forEach(k=>{ if(text.includes(k)) ss+=0.5; }); ss=Math.min(ss,2); kv+=Math.round(ss);
  kv = Math.min(kv, 20);

  // 3. 类别权重 (0-25)
  const cw = SCORE_CATEGORY_WEIGHTS[category] || 10;

  // 4. 来源可信度 (0-15)
  const st = SCORE_SOURCE_TRUST[vendor] || 5;

  // 5. 时效性 (0-5)
  let rc = 0;
  if(pubDate){
    const hrs = (Date.now()-pubDate)/3600000;
    rc = hrs<2?5 : hrs<6?4 : hrs<24?3 : hrs<48?2 : hrs<168?1 : 0;
  }

  // 6. 交叉信号 (0-5)
  let cs = 0;
  if(item._multiSource){
    const c = item._multiSource;
    cs = c>=5?5 : c>=3?4 : c>=2?3 : 1;
  }

  const total = Math.min(Math.round(cq+kv+cw+st+rc+cs), 100);
  return { score:total, breakdown:{ cq,kv,cw,st,rc,cs } };
}

function scoreToBadge(score){
  if(score>=85) return { label:'🚀 必读', cls:'score-s', color:'var(--red)' };
  if(score>=75) return { label:'🔥 重大', cls:'score-h', color:'var(--red)' };
  if(score>=65) return { label:'⚡ 重要', cls:'score-m', color:'var(--orange)' };
  if(score>=50) return { label:'★ 关注', cls:'score-l', color:'var(--teal)' };
  return { label:'○ 一般', cls:'score-n', color:'var(--text-dim)' };
}

function batchScoreNews(items){
  // 多源覆盖度
  const groups = {};
  items.forEach(n=>{ const k=(n.title||'').slice(0,50).toLowerCase(); if(!groups[k]) groups[k]=new Set(); groups[k].add(n.vendor); });
  items.forEach(n=>{
    const k=(n.title||'').slice(0,50).toLowerCase();
    n._multiSource = groups[k]?.size || 1;
    const r = calculateNewsScore(n);
    n.score = r.score;
    n.scoreBreakdown = r.breakdown;
  });
  return items;
}

function generateSummary(title, desc){
  let text = desc || title;
  text = text.replace(/<[^>]+>/g,'').replace(/&[a-z]+;/gi,' ').replace(/&#[0-9]+;/g,' ').replace(/\s+/g,' ').trim();
  if(text.length > 200) text = text.slice(0,200) + '…';
  return text;
}

    id: item.id || hashId(item.title + item.link),
    title: item.title || '',
    titleZh: item.titleZh || '',
    summary: item.summary || '',
    _rawContent: item._rawContent || item.summary || '',
    link: item.link || '',
    pubDate: item.pubDate || Date.now(),
    vendor: item.vendor || 'other',
    category: item.category || 'Product',
    impact: item.impact || 'low',
    score: item.score || null,
    scoreBreakdown: item.scoreBreakdown || null,
    source: item.source || '',
    read: item.read || false,
  };
}

/* ---------- RSS 解析：JSON 格式（rss2json） ---------- */
function parseRSSJSON(json, vendorKey){
  if(!json || json.status !== 'ok' || !json.items) return [];
  return json.items.map(item=>{
    const title = (item.title||'').trim();
    const desc = (item.description||'').trim();
    if(!title) return null;
    return {
      id: hashId(title + item.link),
      title,
      summary: generateSummary(title, desc),
      _rawContent: item.content || desc || '',
      link: item.link || '',
      pubDate: parseDate(item.pubDate),
      vendor: vendorKey,
      category: classify(title, desc),
      impact: assessImpact(title, desc, vendorKey),
      source: VENDOR_MAP[vendorKey]?.name || vendorKey,
      author: item.author || '',
      read: false,
    };
  }).filter(Boolean);
}

/* ---------- RSS 解析：XML 格式（allorigins） ---------- */
function parseRSS(xmlText, vendorKey){
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'text/xml');
  const items = doc.querySelectorAll('item');
  const out = [];
  items.forEach((item, i)=>{
    const title = item.querySelector('title')?.textContent?.trim() || '';
    const link = item.querySelector('link')?.textContent?.trim() || '';
    const pubDate = item.querySelector('pubDate')?.textContent?.trim() || '';
    const desc = item.querySelector('description')?.textContent?.trim() || '';
    const creator = item.querySelector('creator')?.textContent?.trim() || '';
    if(!title) return;
    out.push({
      id: hashId(title + link),
      title,
      summary: generateSummary(title, desc),
      _rawContent: desc || '',
      link,
      pubDate: parseDate(pubDate),
      vendor: vendorKey,
      category: classify(title, desc),
      impact: assessImpact(title, desc, vendorKey),
      source: VENDOR_MAP[vendorKey]?.name || vendorKey,
      author: creator,
      read: false,
    });
  });
  return out;
}

/* ---------- Google News 聚合（Kimi/Qwen/DeepSeek） ---------- */
function parseGoogleNews(xmlText, query){
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'text/xml');
  const items = doc.querySelectorAll('item');
  const out = [];
  items.forEach(item=>{
    const title = item.querySelector('title')?.textContent?.trim() || '';
    const link = item.querySelector('link')?.textContent?.trim() || '';
    const pubDate = item.querySelector('pubDate')?.textContent?.trim() || '';
    const desc = item.querySelector('description')?.textContent?.trim() || '';
    if(!title) return;
    // Google News 标题格式："新闻标题 - 媒体名"，保留新闻标题部分
    const cleanTitle = title.replace(/\s*-\s*[^-]+$/,'').trim() || title;
    const vendor = detectVendor(cleanTitle, desc, '');
    if(vendor === 'other') return;
    out.push({
      id: hashId(title + link),
      title: cleanTitle,
      summary: generateSummary(cleanTitle, desc),
      _rawContent: desc || '',
      link,
      pubDate: parseDate(pubDate),
      vendor,
      category: classify(cleanTitle, desc),
      impact: assessImpact(cleanTitle, desc, vendor),
      source: 'Google News',
      read: false,
    });
  });
  return out;
}

/* ---------- 数据采集：并行代理竞速（最快返回者胜） ---------- */
async function fetchWithProxies(rssUrl, vendorKey, isGoogleNews){
  // 检查缓存
  const cacheKey = `rss_cache:${vendorKey}:${rssUrl}`;
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && (Date.now() - cached.ts) < RSS_CACHE_TTL) {
      return cached.data;
    }
  } catch(e) {}

  // 并行尝试所有代理，取最先成功的（reject 失败的代理，确保 Promise.any 只返回有效数据）
  const tryProxy = (proxyIdx) => new Promise((resolve, reject) => {
    const proxyUrl = PROXIES[proxyIdx](rssUrl);
    fetch(proxyUrl, { signal: AbortSignal.timeout(PROXY_TIMEOUT) })
      .then(resp => {
        if (!resp.ok) return reject(new Error(`HTTP ${resp.status}`));
        return resp.text();
      })
      .then(text => {
        if (proxyIdx === 0) {
          try {
            const json = JSON.parse(text);
            if (json.status === 'ok' && json.items) {
              const parsed = isGoogleNews ? parseGoogleNewsFromJSON(json) : parseRSSJSON(json, vendorKey);
              if (parsed.length > 0) return resolve(parsed);
              return reject(new Error('no items from rss2json'));
            }
          } catch(e) {}
        }
        const result = isGoogleNews ? parseGoogleNews(text, vendorKey) : parseRSS(text, vendorKey);
        if (result.length > 0) return resolve(result);
        reject(new Error('no items parsed'));
      })
      .catch(err => reject(err));
  });

  // 所有代理同时发起，取第一个非空结果
  try {
    const result = await Promise.any(PROXIES.map((_, i) => tryProxy(i)));
    if (result && result.length > 0) {
      // 写入缓存
      try {
        localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data: result }));
      } catch(e) {}
      return result;
    }
  } catch(e) {
    // 所有代理都失败，尝试回退到第一个代理的串行模式
    for (let i = 0; i < PROXIES.length; i++) {
      const proxyUrl = PROXIES[i](rssUrl);
      try {
        const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(PROXY_TIMEOUT) });
        if (!resp.ok) continue;
        const text = await resp.text();
        if (i === 0) {
          try {
            const json = JSON.parse(text);
            if (json.status === 'ok' && json.items) {
              const r = isGoogleNews ? parseGoogleNewsFromJSON(json) : parseRSSJSON(json, vendorKey);
              if (r.length > 0) return r;
            }
          } catch(e) {}
        }
        const r = isGoogleNews ? parseGoogleNews(text, vendorKey) : parseRSS(text, vendorKey);
        if (r.length > 0) return r;
      } catch(e) {}
    }
  }
  return [];
}

/* ---------- Google News JSON 解析（rss2json） ---------- */
function parseGoogleNewsFromJSON(json){
  if(!json || !json.items) return [];
  return json.items.map(item=>{
    const title = (item.title||'').trim();
    const desc = (item.description||'').trim();
    if(!title) return null;
    // Google News 标题格式："新闻标题 - 媒体名"，保留新闻标题部分
    const cleanTitle = title.replace(/\s*-\s*[^-]+$/,'').trim() || title;
    const vendor = detectVendor(cleanTitle, desc, '');
    if(vendor === 'other') return null;
    return {
      id: hashId(title + item.link),
      title: cleanTitle,
      summary: generateSummary(cleanTitle, desc),
      _rawContent: item.content || desc || '',
      link: item.link || '',
      pubDate: parseDate(item.pubDate),
      vendor,
      category: classify(cleanTitle, desc),
      impact: assessImpact(cleanTitle, desc, vendor),
      source: 'Google News',
      read: false,
    };
  }).filter(Boolean);
}

/* ---------- 单源采集 ---------- */
async function fetchRSS(vendorKey){
  const v = VENDOR_MAP[vendorKey];
  if(!v || !v.rss) return [];
  return fetchWithProxies(v.rss, vendorKey, false);
}

async function fetchGoogleNews(query){
  const url = `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=en&gl=US&ceid=US:en`;
  return fetchWithProxies(url, 'gnews', true);
}

/* ---------- GitHub Trending：热门 AI/ML 仓库 ---------- */
async function fetchGitHubTrending(){
  // 检查缓存
  const cacheKey = 'rss_cache:github:trending';
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && (Date.now() - cached.ts) < RSS_CACHE_TTL) return cached.data;
  } catch(e) {}

  // GitHub Search API 原生支持 CORS，无需代理
  const query = encodeURIComponent('topic:llm OR topic:transformer OR topic:machine-learning OR topic:ai stars:>=100 archived:false');
  const url = `https://api.github.com/search/repositories?q=${query}&sort=stars&order=desc&per_page=15`;
  try {
    const resp = await fetch(url, {
      headers: { 'Accept': 'application/vnd.github.v3+json', 'User-Agent': 'AI-Pulse' },
      signal: AbortSignal.timeout(10000)
    });
    if (!resp.ok) return [];
    const data = await resp.json();
    if (!data.items) return [];
    const items = data.items.map(repo => ({
      id: hashId('gh:' + repo.full_name),
      title: repo.full_name,
      summary: (repo.description || 'No description') + ` · ⭐ ${repo.stargazers_count?.toLocaleString()} stars · ${repo.language || 'Unknown'}`,
      _rawContent: repo.description || '',
      link: repo.html_url,
      pubDate: new Date(repo.pushed_at || repo.updated_at).getTime(),
      vendor: 'github',
      category: 'Release',
      impact: repo.stargazers_count > 10000 ? 'high' : repo.stargazers_count > 1000 ? 'med' : 'low',
      source: 'GitHub Trending',
      read: false,
    }));
    try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data: items })); } catch(e) {}
    return items;
  } catch(e) {
    return [];
  }
}

/* ---------- 从预生成 JSON 加载新闻（秒开） ---------- */
async function loadFromJSON(url){
  try {
    const resp = await fetch(url, { signal: AbortSignal.timeout(5000) });
    if (!resp.ok) return false;
    const data = await resp.json();
    if (!data.items || data.items.length === 0) return false;

    STATE.news = data.items.map(normalizeJSONItem);
    STATE.sourcesLoaded = data.sources || 0;
    STATE.lastUpdate = new Date(data.updated || Date.now());

    // 确保评分存在
    if(!STATE.news[0]?.score) batchScoreNews(STATE.news);

    // 缓存到 localStorage
    try {
      localStorage.setItem('ai_pulse_news_cache', JSON.stringify({
        news: STATE.news,
        sourcesLoaded: data.sources,
        lastUpdate: Date.now(),
      }));
    } catch(e) {}

    renderAll();
    return true;
  } catch(e) {
    return false;
  }
}

async function fetchAllNews(){
  $('refreshBtn').classList.add('spinning');

  // 尝试从预生成的 JSON 加载（秒开）
  const jsonLoaded = await loadFromJSON(JSON_DATA_URL);
  if (jsonLoaded) {
    $('refreshBtn').classList.remove('spinning');
    return; // JSON 加载成功，不需要实时抓取
  }

  // JSON 不可用，回退到实时抓取
  $('newsList').innerHTML = '<div class="skel-card"><div class="skeleton skel-title"></div><div class="skeleton skel-sum"></div><div class="skeleton skel-sum2"></div></div><div class="skel-card"><div class="skeleton skel-title"></div><div class="skeleton skel-sum"></div><div class="skeleton skel-sum2"></div></div>';

  const sourceTasks = [];
  const sourceLabels = [];
  // 官方 RSS
  VENDORS.filter(v=>v.rss).forEach(v=> { sourceTasks.push(fetchRSS(v.key)); sourceLabels.push(v.name); });
  // Google News 聚合国产模型
  sourceTasks.push(fetchGoogleNews('Kimi Moonshot AI')); sourceLabels.push('Kimi');
  sourceTasks.push(fetchGoogleNews('Qwen Alibaba model')); sourceLabels.push('Qwen');
  sourceTasks.push(fetchGoogleNews('DeepSeek AI model')); sourceLabels.push('DeepSeek');
  sourceTasks.push(fetchGoogleNews('机器之心 AI 人工智能')); sourceLabels.push('机器之心');
  sourceTasks.push(fetchGoogleNews('量子位 AI 人工智能')); sourceLabels.push('量子位');

  // 渐进式渲染：每个数据源返回后立即更新列表
  let allNews = [];
  let sourceCount = 0;
  let completedCount = 0;
  const totalSources = sourceTasks.length;

  sourceTasks.forEach((task, idx) => {
    task.then(result => {
      completedCount++;
      if (result && result.length > 0) {
        allNews = allNews.concat(result);
        sourceCount++;
        // 去重
        const seen = new Set();
        allNews = allNews.filter(n=>{
          const key = n.title.slice(0,100).toLowerCase();
          if(seen.has(key)) return false;
          seen.add(key);
          return true;
        });
        allNews.sort((a,b)=> b.pubDate - a.pubDate);
        // AI 智能评分
        batchScoreNews(allNews);
        STATE.news = allNews;
        STATE.sourcesLoaded = sourceCount;
        STATE.lastUpdate = new Date();
        // 第一个数据源返回后立即渲染（后续数据源返回时增量更新）
        if (sourceCount === 1) {
          $('newsList').innerHTML = '';
          renderAll();
        } else {
          renderNewsList();
        }
      }
      // 全部完成
      if (completedCount === totalSources) {
        $('refreshBtn').classList.remove('spinning');
        renderAll();
        // 保存新闻数据到 localStorage，下次打开可秒开
        try {
          localStorage.setItem('ai_pulse_news_cache', JSON.stringify({
            news: allNews,
            sourcesLoaded: sourceCount,
            lastUpdate: Date.now(),
          }));
        } catch(e) {}
        showToast(`已加载 ${allNews.length} 条资讯 · ${sourceCount} 个数据源`);
      }
    }).catch(()=> { completedCount++; });
  });
}

/* ---------- 渲染 ---------- */
function getFilteredNews(){
  let list = STATE.news;
  if(STATE.filterVendor !== 'all') list = list.filter(n=> n.vendor === STATE.filterVendor);
  if(STATE.filterCat !== 'all') list = list.filter(n=> n.category === STATE.filterCat);
  // 时间窗口过滤
  if(STATE.filterTime !== 'all'){
    const now = Date.now();
    const cutoff = STATE.filterTime === '24h' ? now - 24*60*60*1000 : now - 7*24*60*60*1000;
    list = list.filter(n=> n.pubDate >= cutoff);
  }
  // 特殊筛选（收藏/已读/未读）
  if(STATE.filterSpecial === 'bookmarked'){
    list = list.filter(n=> STATE.bookmarks.includes(n.id));
  } else if(STATE.filterSpecial === 'read'){
    list = list.filter(n=> STATE.readHistory.includes(n.id));
  } else if(STATE.filterSpecial === 'unread'){
    list = list.filter(n=> !STATE.readHistory.includes(n.id));
  }
  if(STATE.searchQuery){
    const q = STATE.searchQuery.toLowerCase();
    list = list.filter(n=> n.title.toLowerCase().includes(q) || n.summary.toLowerCase().includes(q));
  }
  // 排序
  if(STATE.sortBy === 'score'){
    list = [...list].sort((a,b)=> (b.score||0) - (a.score||0) || (b.pubDate||0) - (a.pubDate||0));
  }
  return list;
}

function renderNewsList(){
  const list = getFilteredNews();
  const container = $('newsList');
  if(list.length === 0){
    container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--text-dim);font-size:13px">暂无相关资讯</div>';
    return;
  }
  container.innerHTML = list.slice(0, 60).map(n=>{
    const v = VENDOR_MAP[n.vendor] || {name:'其他', color:'#888', init:'?'};
    const cachedTitle = TRANSLATION_CACHE[`en|zh:${n.title}`] || n.title;
    const cachedSummary = TRANSLATION_CACHE[`en|zh:${n.summary}`] || n.summary;
    const isRead = STATE.readHistory.includes(n.id);
    const isBookmarked = STATE.bookmarks.includes(n.id);
    // 根据标题显示模式生成标题 HTML
    let titleHTML;
    if(STATE.titleMode === 'en'){
      titleHTML = n.title;
    } else if(STATE.titleMode === 'bi'){
      titleHTML = `${cachedTitle}<div class="news-title-en">${n.title}</div>`;
    } else {
      titleHTML = cachedTitle;
    }
    return `
    <div class="news-card ${isRead?'':'unread'}" data-id="${n.id}" onclick="openArticle('${n.id}')">
      <div class="news-top">
        <span class="vendor-tag" style="background:${v.color}">${v.name}</span>
        <span class="cat-tag ${n.category}">${n.category}</span>
        <span class="impact ${n.impact}">${n.impact==='high'?'🔥 高影响':n.impact==='med'?'⚡ 中':'○ 低'}</span>
        ${n.score!=null ? (()=>{ const b=scoreToBadge(n.score); return `<span class="score-badge ${b.cls}" title="AI评分:${n.score}/100 · 质量${n.scoreBreakdown?.cq||0} 关键词${n.scoreBreakdown?.kv||0} 类别${n.scoreBreakdown?.cw||0} 来源${n.scoreBreakdown?.st||0} 时效${n.scoreBreakdown?.rc||0}">${b.label}<span class="score-num">${n.score}</span></span>`; })() : ''}
        <span class="news-time">${timeAgo(n.pubDate)}</span>
      </div>
      <div class="news-title" data-id="${n.id}" onclick="openArticle('${n.id}')">${titleHTML}</div>
      <div class="news-summary" data-id="${n.id}">${cachedSummary}</div>
      <div class="news-foot">
        <span class="news-source">来源：<a href="${n.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${n.source}</a></span>
        <button class="bookmark-btn ${isBookmarked?'active':''}" data-bookmark="${n.id}" onclick="toggleBookmark('${n.id}');event.stopPropagation()" title="${isBookmarked?'取消收藏':'收藏'}">${isBookmarked?'★':'☆'}</button>
      </div>
    </div>`;
  }).join('');
  // 异步翻译未缓存的内容
  batchTranslateNews(list.slice(0, 60));
}

function markRead(id){
  if(!STATE.readHistory.includes(id)){
    STATE.readHistory.push(id);
    // 限制历史记录最多 500 条
    if(STATE.readHistory.length > 500) STATE.readHistory = STATE.readHistory.slice(-500);
    try { localStorage.setItem('ai_pulse_read_history', JSON.stringify(STATE.readHistory)); } catch(e) {}
  }
}

function toggleBookmark(id){
  const idx = STATE.bookmarks.indexOf(id);
  if(idx >= 0){
    STATE.bookmarks.splice(idx, 1);
    showToast('已取消收藏');
  } else {
    STATE.bookmarks.push(id);
    showToast('已收藏');
  }
  try { localStorage.setItem('ai_pulse_bookmarks', JSON.stringify(STATE.bookmarks)); } catch(e) {}
  renderNewsList();
  renderSpecialFilters();
}

        <div class="vendor-name">全部厂商</div>

function renderTrendChart(){
  const dom = $('chartTrend');
  if(!dom || dom.offsetWidth === 0) return;
  const days = 7;
  const data = [];
  const labels = [];
  const now = new Date();
  for(let i=days-1;i>=0;i--){
    const d = new Date(now); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const next = new Date(d); next.setDate(next.getDate()+1);
    const count = STATE.news.filter(n=> n.pubDate >= d.getTime() && n.pubDate < next.getTime()).length;
    data.push(count);
    labels.push((d.getMonth()+1) + '/' + d.getDate());
  }
  const existing = echarts.getInstanceByDom(dom);
  if(existing) existing.dispose();
  const chart = echarts.init(dom);

function renderScoreChart(){
  const dom = $('chartScore');
  if(!dom || dom.offsetWidth === 0) return;
  const isDark = document.documentElement.dataset.theme === 'dark';
  const scored = STATE.news.filter(n=>n.score!=null);
  if(scored.length === 0){
    dom.innerHTML = '<div style="text-align:center;color:var(--text-dim);font-size:11px;padding:30px 0">暂无评分数据</div>';
    return;
  }
  const ranges = [
    { name:'必读(85+)', min:85, max:101, color: isDark?'#ff6b6b':'#c50f1f' },
    { name:'重大(75-84)', min:75, max:85, color: isDark?'#fa5252':'#e81123' },
    { name:'重要(65-74)', min:65, max:75, color: isDark?'#ff922b':'#ca5010' },
    { name:'关注(50-64)', min:50, max:65, color: isDark?'#20c997':'#008272' },
    { name:'一般(<50)', min:0, max:50, color: isDark?'#6c6c80':'#8a8aa0' },
  ];
  const data = ranges.map(r => ({
    name: r.name,
    value: scored.filter(n => n.score >= r.min && n.score < r.max).length,
    itemStyle: { color: r.color }
  })).filter(d => d.value > 0);
  const existing2 = echarts.getInstanceByDom(dom);
  if(existing2) existing2.dispose();
  const chart = echarts.init(dom);
  const tooltipBg = isDark ? '#1e1e3a' : '#fff';
  const tooltipBorder = isDark ? '#2a2a45' : '#e5e5f0';
  const tooltipText = isDark ? '#e0e0ef' : '#1a1a2e';
  const labelColor = isDark ? '#8e8ea0' : '#5a5a72';
  chart.setOption({
    tooltip:{trigger:'item',backgroundColor:tooltipBg,borderColor:tooltipBorder,textStyle:{color:tooltipText,fontSize:11},
      formatter:p=>`${p.name}<br/>${p.value} 篇 (${p.percent}%)`},
    legend:{orient:'vertical',right:5,top:'center',textStyle:{color:labelColor,fontSize:9},itemWidth:8,itemHeight:8},
    series:[{
      type:'pie',radius:['35%','65%'],center:['35%','50%'],
      label:{show:false},labelLine:{show:false},
      emphasis:{label:{show:true,fontSize:10,fontWeight:'bold',color:tooltipText}},
      data
    }]
  });
}

function renderVendorChart(){
  const dom = $('chartVendor');
  if(!dom || dom.offsetWidth === 0) return;
  const isDark = document.documentElement.dataset.theme === 'dark';
  const groups = {};
  STATE.news.forEach(n=>{
    const v = n.vendor || 'other';
    if(!groups[v]) groups[v] = { total:0, high:0, med:0, low:0 };
    groups[v].total++;
    if(n.impact==='high') groups[v].high++;
    else if(n.impact==='med') groups[v].med++;
    else groups[v].low++;
  });
  const vendors = Object.entries(groups).map(([k,v])=>({name:VENDOR_MAP[k]?.name||k, ...v}))
    .sort((a,b)=>b.total-a.total).slice(0,8);
  const existing3 = echarts.getInstanceByDom(dom);
  if(existing3) existing3.dispose();
  const chart = echarts.init(dom);
  const axisLineColor = isDark ? '#3a3a55' : '#d0d0de';
  const axisLabelColor = isDark ? '#8e8ea0' : '#5a5a72';
  const splitLineColor = isDark ? '#2a2a45' : '#e5e5f0';
  const tooltipBg = isDark ? '#1e1e3a' : '#fff';
  const tooltipBorder = isDark ? '#2a2a45' : '#e5e5f0';
  const tooltipText = isDark ? '#e0e0ef' : '#1a1a2e';
  chart.setOption({
    grid:{left:70,right:12,top:8,bottom:20,containLabel:true},
    xAxis:{type:'value',axisLine:{show:false},axisTick:{show:false},
      axisLabel:{color:axisLabelColor,fontSize:9},splitLine:{lineStyle:{color:splitLineColor}}},
    yAxis:{type:'category',data:vendors.map(v=>v.name),
      axisLine:{lineStyle:{color:axisLineColor}},axisTick:{show:false},
      axisLabel:{color:axisLabelColor,fontSize:9}},
    tooltip:{trigger:'axis',backgroundColor:tooltipBg,borderColor:tooltipBorder,textStyle:{color:tooltipText,fontSize:11},
      axisPointer:{type:'shadow'}},
    series:[
      {name:'高',type:'bar',stack:'t',barWidth:'50%',itemStyle:{color:isDark?'#ff6b6b':'#c50f1f'},
        data:vendors.map(v=>v.high)},
      {name:'中',type:'bar',stack:'t',barWidth:'50%',itemStyle:{color:isDark?'#ff922b':'#ca5010'},
        data:vendors.map(v=>v.med)},
      {name:'低',type:'bar',stack:'t',barWidth:'50%',itemStyle:{color:isDark?'#20c997':'#008272'},
        data:vendors.map(v=>v.low)}
    ]
  });
}

function renderKeywords(){
  const kws = {};
  const stopWords = new Set(['the','a','an','and','or','to','of','in','for','on','with','is','are','was','were','be','will','that','this','it','as','at','by','from','has','have','new','said','says','的','了','在','是','和','与','为','了']);
  STATE.news.forEach(n=>{
    const words = (n.title + ' ' + n.summary).split(/[\s,，。.:：;；!！?？()（）"'']/);
    words.forEach(w=>{
      w = w.trim().toLowerCase();
      if(w.length < 2 || stopWords.has(w)) return;
      if(/^\d+$/.test(w)) return;
      kws[w] = (kws[w]||0) + 1;
    });
  });
  const sorted = Object.entries(kws).sort((a,b)=>b[1]-a[1]).slice(0, 24);
  $('trendList').innerHTML = sorted.map(([w,c])=>`<span class="trend-tag">${w}<span class="n">${c}</span></span>`).join('');
}

document.addEventListener('click', e=>{
  // 厂商筛选
  const vi = e.target.closest('.vendor-item');
  if(vi){
    STATE.filterVendor = vi.dataset.vendor;
    document.querySelectorAll('.vendor-item').forEach(x=>x.classList.toggle('active', x===vi));
    $('feedTitle').textContent = STATE.filterVendor==='all' ? '全部资讯' : (VENDOR_MAP[STATE.filterVendor]?.name || '其他');
    renderNewsList();
    return;
  }
  // 分类筛选
  const ci = e.target.closest('.cat-item');
  if(ci){
    STATE.filterCat = STATE.filterCat === ci.dataset.cat ? 'all' : ci.dataset.cat;
    document.querySelectorAll('.cat-item').forEach(x=>x.classList.toggle('active', x===ci && STATE.filterCat===ci.dataset.cat));
    renderNewsList();
    return;
  }
  // Tab
  const tab = e.target.closest('.tab');
  if(tab){
    STATE.filterCat = tab.dataset.cat;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t===tab));
    renderNewsList();
    return;
  }
  // 标题显示模式切换
  const tm = e.target.closest('.tm-btn');
  if(tm){
    STATE.titleMode = tm.dataset.mode;
    localStorage.setItem('ai_pulse_title_mode', STATE.titleMode);
    document.querySelectorAll('.tm-btn').forEach(x=>x.classList.toggle('active', x===tm));
    renderNewsList();
    return;
  }
  // 排序切换
  const sb = e.target.closest('.sort-btn');
  if(sb){
    STATE.sortBy = sb.dataset.sort;
    document.querySelectorAll('.sort-btn').forEach(x=>x.classList.toggle('active', x===sb));
    renderNewsList();
    return;
  }
  // 时间窗口筛选
  const tf = e.target.closest('.tf-btn');
  if(tf){
    STATE.filterTime = tf.dataset.time;
    document.querySelectorAll('.tf-btn').forEach(x=>x.classList.toggle('active', x===tf));
    renderNewsList();
    return;
  }
  // 快捷筛选（收藏/已读/未读）
  const sf = e.target.closest('.filter-item');
  if(sf){
    const key = sf.dataset.special;
    STATE.filterSpecial = STATE.filterSpecial === key ? 'all' : key;
    renderSpecialFilters();
    renderNewsList();
    return;
  }
});

async function openArticle(id) {
  const news = STATE.news.find(n => n.id === id);
  if (!news) return;

  markRead(id);

  // 显示模态框
  const modal = $('articleModal');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';

  // 填充头部信息
  const v = VENDOR_MAP[news.vendor] || {name:'其他', color:'#888', init:'?'};
  $('modalHeader').innerHTML = `
    <div class="modal-header-inner">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <button class="modal-back-btn" onclick="closeArticle()">← 返回</button>
        <button class="bookmark-btn ${STATE.bookmarks.includes(news.id)?'active':''}" onclick="toggleBookmark('${news.id}')" title="${STATE.bookmarks.includes(news.id)?'取消收藏':'收藏'}" style="font-size:20px">${STATE.bookmarks.includes(news.id)?'★':'☆'}</button>
      </div>
      <div class="modal-meta">
        <span class="vendor-tag" style="background:${v.color}">${v.name}</span>
        <span class="cat-tag ${news.category}">${catLabel(news.category)}</span>
        <span class="impact ${news.impact}">${news.impact==='high'?'🔥 高影响':news.impact==='med'?'⚡ 中影响':'○ 低影响'}</span>
        ${news.score!=null ? (()=>{ const b=scoreToBadge(news.score); return `<span class="score-badge ${b.cls}" title="AI智能评分">${b.label}<span class="score-num">${news.score}</span></span>`; })() : ''}
        <span class="news-time">${timeAgo(news.pubDate)}</span>
      </div>
      <h1 class="modal-title" data-news-id="${news.id}">${TRANSLATION_CACHE[`en|zh:${news.title}`] || news.title}</h1>
      <div class="modal-subtitle">来源：${news.source} · ${new Date(news.pubDate).toLocaleDateString('zh-CN')}</div>
    </div>
  `;

  // 设置原文链接
  $('originalLink').href = news.link;

  // 异步翻译标题（如果未缓存）
  if (!TRANSLATION_CACHE[`en|zh:${news.title}`] && /^[\x00-\x7F]+$/.test(news.title)) {
    translateText(news.title).then(translated => {
      const mel = document.querySelector('.modal-title[data-news-id="' + news.id + '"]');
      if (mel && translated) mel.textContent = translated;
    });
  }

  // 显示加载骨架屏，隐藏内容
  $('modalLoading').style.display = 'block';
  $('modalContent').style.display = 'none';
  $('modalFooter').style.display = 'none';

  // 尝试生成 AI 摘要
  try {
    const aiSummary = await generateAISummary(news);
    $('modalContent').innerHTML = aiSummary;
    $('modalContent').style.display = 'block';
    $('modalFooter').style.display = 'flex';
  } catch(e) {
    // AI 摘要失败时，直接显示原始描述
    $('modalContent').innerHTML = `
      <div class="article-text">${news.summary}</div>
      <div class="ai-fallback-note">⚠️ AI 摘要生成失败，显示原始内容</div>
    `;
    $('modalContent').style.display = 'block';
    $('modalFooter').style.display = 'flex';
  } finally {
    $('modalLoading').style.display = 'none';
  }
}

function closeArticle() {
  const modal = $('articleModal');
  modal.classList.remove('open');
  document.body.style.overflow = '';
  renderNewsList(); // 刷新已读状态
  renderSpecialFilters(); // 刷新收藏/已读计数
}

/* 从文本中提取关键句 */
function extractKeySentences(text, count=5) {
  // 先彻底清理 HTML 标签和实体
  let clean = text
    .replace(/<[^>]+>/g, ' ')        // 去掉所有 HTML 标签
    .replace(/&[a-z]+;/gi, ' ')       // 去掉 HTML 实体 (&nbsp; &amp; 等)
    .replace(/&#[0-9]+;/g, ' ')       // 去掉数字实体
    .replace(/\s+/g, ' ')             // 合并多余空格
    .trim();
  const sentences = clean.split(/[.!?。！？\n]+/).filter(s => s.trim().length > 15);
  const scored = sentences.map(s => {
    let score = 0;
    const lower = s.toLowerCase();
    if (/\d+/.test(s)) score += 2;
    if (/\b(gpt|claude|gemini|llama|model|ai|training|benchmark|parameter|token)\b/i.test(s)) score += 2;
    if (/\b(new|first|launch|release|announce|introduce|unveil)\b/i.test(lower)) score += 1;
    if (s.length > 30 && s.length < 200) score += 1;
    return { sentence: s.trim(), score };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, count).map(x => x.sentence);
}

/* 随机选取模板 */
function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/* 将英文内容翻译为中文（用于摘要中的原文引用） */
async function translateForSummary(text) {
  if (!text) return '';
  // 如果已经缓存，直接返回
  const key = `en|zh:${text}`;
  if (TRANSLATION_CACHE[key]) return TRANSLATION_CACHE[key];
  // 否则尝试翻译（但不阻塞）
  translateText(text).then(t => {});
  return text;
}

/* ---------- AI 摘要生成 ---------- */
async function generateAISummary(news) {
  // 深度抓取原文：尝试多种方式获取更多内容
  let fullText = news.summary || '';
  let extractedParagraphs = [];

  // 方式1：通过 allorigins 抓取原文 HTML
  try {
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(news.link)}`;
    const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
    if (resp.ok) {
      const html = await resp.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script,style,nav,footer,header,aside,iframe,form').forEach(el => el.remove());

      // 尝试提取 article 标签内容
      let articleText = '';
      const article = doc.querySelector('article');
      if (article) {
        articleText = article.innerText.trim();
        extractedParagraphs = article.innerText.split(/\n+/).filter(p => p.trim().length > 40).slice(0, 20);
      }
      // 尝试提取 main 标签内容
      if (!articleText) {
        const main = doc.querySelector('main');
        if (main) {
          articleText = main.innerText.trim();
          extractedParagraphs = main.innerText.split(/\n+/).filter(p => p.trim().length > 40).slice(0, 20);
        }
      }
      // 最后尝试 body 中较长段落
      if (!articleText) {
        const bodyParas = Array.from(doc.querySelectorAll('p'))
          .map(p => p.innerText.trim())
          .filter(t => t.length > 60 && t.length < 800);
        if (bodyParas.length > 0) {
          articleText = bodyParas.join('\n\n');
          extractedParagraphs = bodyParas.slice(0, 20);
        }
      }

      if (articleText.length > 100) {
        fullText = articleText.slice(0, 4000);
      }
    }
  } catch(e) {
    console.warn('原文抓取失败:', e.message);
  }

  // 方式2：如果 rss2json 有 content 字段（通常比 description 更完整）
  if (news._rawContent && news._rawContent.length > fullText.length) {
    // 清理 HTML 标签后再使用
    fullText = news._rawContent.replace(/<[^>]+>/g, ' ').replace(/&[a-z]+;/gi, ' ').replace(/&#[0-9]+;/g, ' ').replace(/\s+/g, ' ').trim();
  }

  // 方式3：尝试通过 rss2json 的 enclosure 或其他字段获取更多内容（暂无）

  // 合并提取到的段落作为素材
  const material = {
    title: news.title,
    summary: news.summary,
    fullText: fullText,
    paragraphs: extractedParagraphs,
    keySentences: extractKeySentences(fullText, 6),
    vendor: news.vendor,
    category: news.category,
    impact: news.impact,
    source: news.source,
    link: news.link,
  };

  // 生成结构化摘要
  return generateSmartSummary(material);
}

function generateOneLiner(m, v) {
  const catDesc = { Release: '发布了新产品/技术', Product: '推出了重要产品更新', Research: '发表了新的研究成果', Funding: '获得了新一轮融资', Agent: '在智能体领域有新进展', Safety: '发布了安全相关动态' };
  const desc = catDesc[m.category] || '有了新的重要动态';
  const impactDesc = m.impact === 'high' ? '，这在业内引发了高度关注' : m.impact === 'med' ? '，值得行业观察者留意' : '';

  // 尝试从关键句中提取最核心的一句话，并确保翻译为中文
  let core = '';
  if (m.keySentences.length > 0) {
    let raw = m.keySentences[0];
    // 清理残留 HTML
    raw = raw.replace(/<[^>]+>/g, '').replace(/&[a-z]+;/gi, ' ').replace(/\s+/g, ' ').trim();
    const cacheKey = `en|zh:${raw}`;
    if (TRANSLATION_CACHE[cacheKey]) {
      core = TRANSLATION_CACHE[cacheKey];
    } else if (/^[\x00-\x7F\s]+$/.test(raw)) {
      // 英文内容：用本地词典做快速翻译，同时异步请求 API 翻译
      core = quickTranslateCN(raw);
    } else {
      // 已经包含中文或其他语言，直接使用
      core = raw;
    }
    if (core.length > 120) core = core.slice(0, 120) + '…';
  }

  // 如果翻译后仍有大量英文残留，跳过 core 只显示中文描述
  if (core) {
    const enWordCount = (core.match(/[a-zA-Z]{4,}/g) || []).length;
    const totalWords = core.split(/\s+/).length;
    if (enWordCount / Math.max(1, totalWords) > 0.5) {
      // 英文占比过高，不显示 core
      return `${v.name}${desc}${impactDesc}，这可能会对 AI 行业的竞争格局产生一定影响。`;
    }
    return `${v.name}${desc}：${core}${impactDesc}。`;
  }
  return `${v.name}${desc}${impactDesc}，这可能会对 AI 行业的竞争格局产生一定影响。`;
}

/* 本地词典快速翻译（用于一句话速览，不等待 API） */
function quickTranslateCN(text) {
  if (!text) return text;
  // 先清理可能的残留 HTML
  let result = text.replace(/<[^>]+>/g, ' ').replace(/&[a-z]+;/gi, ' ').replace(/\s+/g, ' ').trim();
  // 按词组从长到短替换
  const entries = Object.entries(FALLBACK_DICT).sort((a, b) => b[0].length - a[0].length);
  for (const [en, zh] of entries) {
    const re = new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    result = result.replace(re, zh);
  }
  // 如果翻译后仍有大量英文字母（>30%），说明翻译不充分，
  // 异步触发 API 翻译，同时返回词典翻译结果
  const enRatio = (result.match(/[a-zA-Z]{3,}/g) || []).length / Math.max(1, result.split(/\s+/).length);
  if (enRatio > 0.3 && /^[\x00-\x7F\s]+$/.test(text)) {
    // 异步翻译，不阻塞当前渲染
    translateText(text).then(t => {
      if (t && t !== text) {
        // 更新 DOM 中的一句话速览
        document.querySelectorAll('.summary-text').forEach(el => {
          if (el.textContent.includes(text.substring(0, 30))) {
            const oldHTML = el.innerHTML;
            el.innerHTML = oldHTML.replace(text, t);
          }
        });
      }
    }).catch(()=>{});
  }
  return result;
}

function generateWhatIsIt(m, v, tmpl, techTmpl) {
  const parts = [];
  parts.push(`<p class="summary-text"><strong>${v.name}</strong> ${pick(tmpl.intro)}</p>`);
  parts.push(`<p class="summary-text">具体来说，${pick(techTmpl.what)} 用更通俗的话说，这项技术/产品试图解决的核心问题是：<strong>如何让 AI 在特定场景下表现得更好、更可靠、更易用</strong>。</p>`);
  parts.push(`<p class="summary-text">对于不熟悉技术细节的读者，你可以这样理解：${pick(techTmpl.why)}</p>`);
  return parts.join('');
}

function generateTechDetail(m, v, tmpl, techTmpl) {
  const parts = [];

  // 引言
  parts.push(`<p class="summary-text">${pick(tmpl.tech)}</p>`);

  // 技术原理
  parts.push(`<p class="summary-text"><strong>技术原理层面：</strong>${pick(techTmpl.how)}</p>`);

  // 为什么重要
  parts.push(`<p class="summary-text"><strong>为什么这很重要？</strong>${pick(techTmpl.why)}</p>`);

  // 区别/进步
  parts.push(`<p class="summary-text"><strong>与之前相比有什么进步？</strong>${pick(techTmpl.diff)}</p>`);

  // 如果有提取到的关键句，加入原文信息作为补充（翻译为中文）
  if (m.keySentences.length >= 2) {
    const rawQuotes = m.keySentences.slice(1, 4).map(s => {
      // 先清理 HTML
      const clean = s.replace(/<[^>]+>/g, '').replace(/&[a-z]+;/gi, ' ').replace(/\s+/g, ' ').trim();
      const cacheKey = `en|zh:${clean}`;
      if (TRANSLATION_CACHE[cacheKey]) return TRANSLATION_CACHE[cacheKey];
      if (/^[\x00-\x7F\s]+$/.test(clean)) {
        const translated = quickTranslateCN(clean);
        // 检查英文占比，如果太高就跳过这条
        const enWords = (translated.match(/[a-zA-Z]{4,}/g) || []).length;
        const total = translated.split(/\s+/).length;
        if (enWords / Math.max(1, total) > 0.5) return null; // 跳过英文过多的句子
        return translated;
      }
      return clean;
    }).filter(s => s !== null); // 过滤掉被跳过的
    if (rawQuotes.length > 0) {
      parts.push(`<blockquote class="summary-quote"><strong>📄 原文关键信息摘录：</strong><br/>${rawQuotes.join('；')}。</blockquote>`);
    }
  } else if (m.summary && m.summary.length > 30) {
    let sumText = m.summary.slice(0, 300);
    const sumCacheKey = `en|zh:${m.summary}`;
    if (TRANSLATION_CACHE[sumCacheKey]) {
      sumText = TRANSLATION_CACHE[sumCacheKey].slice(0, 300);
    } else if (/^[\x00-\x7F\s]+$/.test(sumText)) {
      const translated = quickTranslateCN(sumText);
      const enWords = (translated.match(/[a-zA-Z]{4,}/g) || []).length;
      const total = translated.split(/\s+/).length;
      if (enWords / Math.max(1, total) > 0.5) {
        // 英文过多，不显示原文摘要
        sumText = null;
      } else {
        sumText = translated.slice(0, 300);
      }
    }
    if (sumText) {
      parts.push(`<blockquote class="summary-quote"><strong>📄 原文摘要：</strong><br/>${sumText}${m.summary.length > 300 ? '…' : ''}</blockquote>`);
    }
  }

  return parts.join('');
}

      if (enWords / Math.max(1, total) <= 0.5) {
        base[0].desc = `据原文信息，${translated.slice(0, 120)}。这构成了本次动态的核心内容，值得首先关注。`;
      }
    } else {
      base[0].desc = `据原文信息，${ks}。这构成了本次动态的核心内容，值得首先关注。`;
    }
  }
  if (m.keySentences.length > 1) {
    let ks = m.keySentences[1].replace(/<[^>]+>/g, '').replace(/&[a-z]+;/gi, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
    const ksCacheKey = `en|zh:${ks}`;
    if (TRANSLATION_CACHE[ksCacheKey]) {
      ks = TRANSLATION_CACHE[ksCacheKey].slice(0, 120);
    } else if (/^[\x00-\x7F\s]+$/.test(ks)) {
      const translated = quickTranslateCN(ks);
      const enWords = (translated.match(/[a-zA-Z]{4,}/g) || []).length;
      const total = translated.split(/\s+/).length;
      if (enWords / Math.max(1, total) <= 0.5) {

/* ---------- 右侧面板拖动调整大小 ---------- */
(function initResizer(){
  const resizer = $('panelResizer');
  const rightPanel = $('rightPanel');
  if(!resizer || !rightPanel) return;

  let startX, startW, isDragging = false;
  const MIN_W = 240, MAX_W = 520;

  // 恢复保存的宽度
  try {
    const saved = localStorage.getItem('ai_pulse_right_width');
    if(saved){
      rightPanel.style.setProperty('--rpw', saved + 'px');
      rightPanel.style.width = saved + 'px';
    }
  } catch(e) {}

  function startDrag(clientX){
    isDragging = true;
    startX = clientX;
    startW = rightPanel.getBoundingClientRect().width;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  }

  function doDrag(clientX){
    if(!isDragging) return;
    const dx = startX - clientX; // 向左拖 = 变宽
    let newW = Math.round(startW + dx);
    newW = Math.max(MIN_W, Math.min(MAX_W, newW));
    rightPanel.style.setProperty('--rpw', newW + 'px');
    rightPanel.style.width = newW + 'px';
    // 触发图表 resize
    if(window.echarts){
      document.querySelectorAll('#chartTrend,#chartScore,#chartVendor').forEach(el=>{
        const inst = echarts.getInstanceByDom(el);
        if(inst) inst.resize();
      });
    }
  }

  function endDrag(){
    if(!isDragging) return;
    isDragging = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    try {
      const w = rightPanel.getBoundingClientRect().width;
      localStorage.setItem('ai_pulse_right_width', Math.round(w));
    } catch(e) {}
  }

  // 鼠标事件
  resizer.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX); });
  document.addEventListener('mousemove', e => doDrag(e.clientX));
  document.addEventListener('mouseup', endDrag);

  // 触屏事件
  resizer.addEventListener('touchstart', e => { e.preventDefault(); startDrag(e.touches[0].clientX); }, {passive:false});
  document.addEventListener('touchmove', e => { if(isDragging){ e.preventDefault(); doDrag(e.touches[0].clientX); } }, {passive:false});
  document.addEventListener('touchend', endDrag);
})();

  ].filter(Boolean);

  panels.forEach(panel => {
    panel.addEventListener('wheel', function(e) {
      // 内容未超出容器时不处理，让事件自然消失
      if (panel.scrollHeight <= panel.clientHeight) return;

      const atTop    = panel.scrollTop <= 0;
      const atBottom = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 1;
      const scrollingDown = e.deltaY > 0;
      const scrollingUp   = e.deltaY < 0;

      // 到达边界时阻止默认滚动行为，防止滚动传递到其他区域
      if ((scrollingDown && atBottom) || (scrollingUp && atTop)) {
        e.preventDefault();
      }
      // 未到边界时不阻止默认行为，让浏览器原生滚动（流畅、支持触控板惯性）
      // stopPropagation 确保事件不会冒泡到其他面板
      e.stopPropagation();
    }, { passive: false });
  });
})();
</script>
</body>
</html>
